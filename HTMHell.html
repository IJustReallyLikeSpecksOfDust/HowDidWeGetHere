<!DOCTYPE html> 
<!-- TUTORIAL USED: https://www.youtube.com/watch?v=cipihnawJww -->
<html lang="en-AU"> 
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial scale=1.0">
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/quill/0.0.0-experimental-fdd181b39-20240117/quill.snow.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
        <script src="https://cdnjs.cloudflare.com/ajax/libs/quill/0.0.0-experimental-fdd181b39-20240117/quill.js"></script>
        <title>The Amazing Digital Diary</title>
    </head>
<body>

     <!--Home Screen-->
     <div id="homeScreen">
        <div class="home-icon"><i class="fas fa-book"></i></div>
        <h1>The Amazing Digital Diary</h1>
        <button id="openDiaryBtn">Open Diary</button>
    </div>

    <!-- Main Thingy! -->
    <div id="app">
        <!-- Header. In case you can't read the next line. Oh and I should clarify I'm talking to myself, not insulting anyone who may or may not read this-->
        <div class="app-header">
            <div class="brand"><i class="fas fa-book-open"></i>My Diary</div>
            <div class="header-actions">
                <!-- This is the moon button -->
                <button class="theme-btn" id="themeToggle"><i class="fas fa-moon" id="themeIcon"></i></button>
            </div>
        </div>
        <!-- Main Grid -->
        <div class="diary-grid">
        <!-- Entries-->
        <div class="entries-section">

            <!-- Mood Tracker -->
            <div class="mood-tracker">
                <span class="mood-label"><i class="fas fa-smile"></i>Mood</span>
                <div class="mood-options" id="moodOptions">
                    <button data-mood="😆" title="Happy">😆</button>
                    <button data-mood="😐" title="Neutural">😐</button>
                    <button data-mood="😢" title="Sad">😢</button>
                    <button data-mood="😡" title="Angry">😡</button>
                    <button data-mood="😴" title="Tired">😴</button>
                    <button data-mood="😟" title="Stressed">😟</button>
                </div>

                <span class="selected-mood-text" id="selectedMoodText">None</span>
            </div>

            <!-- Text Editor -->
            <div class="editor-wrapper">
                <div id="editor-container"></div>
                <div class="editor-actions">
                    <button class="btn-delete" id="deleteEntryBtn"><i class="fas fa-trash-alt"></i>Delete</button>
                    <button class="btn-save" id="saveEntryBtn"><i class="fas fa-save"></i>Save</button>
                </div>
            </div>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
